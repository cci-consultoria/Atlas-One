<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:18px;animation:a1in .2s ease">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-family:'Geist Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--a1-text-3,#7A7D85)">{{ c.eyebrow }}</div>
      <div style="font-size:28px;font-weight:600;letter-spacing:-.025em">{{ c.title }}</div>
      <div style="font-size:13.5px;color:var(--a1-text-2,#62656D)">{{ sub }}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button onClick="{{ exportX }}" style="height:40px;padding:0 14px;border:1px solid var(--a1-field-border,#DCDBD5);border-radius:9px;background:var(--a1-surface,#fff);font-size:13px;font-weight:550;cursor:pointer;display:flex;align-items:center;gap:8px"><x-import component="Icon" from="./Icon.js" i="download" size="16" hint-size="16px,16px"></x-import>Exportar</button>
      <button onClick="{{ primaryRun }}" style="height:40px;padding:0 16px;border:0;border-radius:9px;background:var(--a1-strong,#15171C);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px" style-hover="background:var(--a1-strong-hover,#2A2D35)"><x-import component="Icon" from="./Icon.js" i="{{ c.pIcon }}" size="16" hint-size="16px,16px"></x-import>{{ c.primary }}</button>
    </div>
  </div>

  <sc-if value="{{ c.note }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--a1-info-bg2,#EEF2FC);border:1px solid var(--a1-info-border,#D6E0F8);font-size:13px;line-height:1.5">
      <span style="color:var(--a1-accent-text,#2D5BD8);display:flex;margin-top:1px"><x-import component="Icon" from="./Icon.js" i="info" size="16" hint-size="16px,16px"></x-import></span><span>{{ c.note }}</span>
    </div>
  </sc-if>

  <sc-if value="{{ hasKpis }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
        <div style="background:var(--a1-surface,#fff);border:1px solid var(--a1-border,#E6E5E0);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;color:var(--a1-text-2,#62656D);font-size:13px"><span>{{ k.label }}</span><x-import component="Icon" from="./Icon.js" i="{{ k.icon }}" size="16" color="var(--a1-text-5,#9A9DA4)" hint-size="16px,16px"></x-import></div>
          <div style="font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums">{{ k.value }}</div>
          <div style="font-size:12.5px;color:{{ k.noteColor }}">{{ k.note }}</div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start">
    <div style="flex:3 1 640px;min-width:0;background:var(--a1-surface,#fff);border:1px solid var(--a1-border,#E6E5E0);border-radius:12px;overflow:hidden">
      <div style="padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--a1-divider,#EFEEEA)">
        <div style="font-size:15px;font-weight:600;margin-right:6px">{{ c.tTitle }}</div>
        <div style="display:flex;align-items:center;gap:8px;height:34px;flex:1 1 200px;max-width:300px;padding:0 10px;border:1px solid var(--a1-field-border,#DCDBD5);border-radius:8px;color:var(--a1-text-4,#8A8D95)"><x-import component="Icon" from="./Icon.js" i="search" size="15" hint-size="15px,15px"></x-import><input value="{{ q }}" onChange="{{ setQ }}" placeholder="Pesquisar" style="flex:1;min-width:0;border:0;outline:0;font-size:13px;background:transparent"></input></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <sc-for list="{{ chips }}" as="ch" hint-placeholder-count="3">
            <button onClick="{{ ch.pick }}" style="height:30px;padding:0 10px;border:1px solid {{ ch.border }};border-radius:999px;background:{{ ch.bg }};color:{{ ch.fg }};font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">{{ ch.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:760px">
          <thead><tr style="background:var(--a1-surface-2,#FAFAF8);color:var(--a1-text-2,#62656D);font-size:12px"><sc-for list="{{ cols }}" as="h" hint-placeholder-count="6"><th style="padding:10px 14px;font-weight:550;text-align:{{ h.align }};white-space:nowrap">{{ h.label }}</th></sc-for></tr></thead>
          <tbody>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
              <tr style="border-top:1px solid var(--a1-divider-2,#F2F1ED)" style-hover="background:var(--a1-surface-2,#FAFAF8)">
                <sc-for list="{{ r }}" as="cl" hint-placeholder-count="6">
                  <td style="padding:11px 14px;text-align:{{ cl.align }};white-space:{{ cl.ws }};min-width:{{ cl.minw }};font-family:{{ cl.font }};font-size:{{ cl.fs }};font-weight:{{ cl.w }};font-variant-numeric:tabular-nums">
                    <sc-if value="{{ cl.badge }}" hint-placeholder-val="{{ false }}"><span style="font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:{{ cl.bBg }};color:{{ cl.bFg }};white-space:nowrap;font-family:'Geist',system-ui,sans-serif">{{ cl.t }}</span></sc-if>
                    <sc-if value="{{ cl.plain }}" hint-placeholder-val="{{ true }}">{{ cl.t }}</sc-if>
                  </td>
                </sc-for>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding:44px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
          <div style="width:44px;height:44px;border-radius:11px;background:var(--a1-muted,#F1F0EC);color:var(--a1-text-2,#62656D);display:flex;align-items:center;justify-content:center"><x-import component="Icon" from="./Icon.js" i="search-x" size="20" hint-size="20px,20px"></x-import></div>
          <div style="font-size:14.5px;font-weight:600">Nada encontrado</div>
          <div style="font-size:13px;color:var(--a1-text-3,#7A7D85)">Ajuste a pesquisa ou o filtro de situação.</div>
          <button onClick="{{ clear }}" style="height:34px;padding:0 14px;border:1px solid var(--a1-field-border,#DCDBD5);border-radius:8px;background:var(--a1-surface,#fff);font-size:13px;font-weight:550;cursor:pointer">Limpar filtros</button>
        </div>
      </sc-if>
      <div style="padding:10px 16px;border-top:1px solid var(--a1-divider,#EFEEEA);font-size:12.5px;color:var(--a1-text-3,#7A7D85)">{{ count }}</div>
    </div>

    <div style="flex:1 1 280px;min-width:0;background:var(--a1-surface,#fff);border:1px solid var(--a1-border,#E6E5E0);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:600">Áreas do módulo</span><span style="font-size:12.5px;color:var(--a1-text-3,#7A7D85)">Estrutura funcional prevista</span></div>
      <sc-for list="{{ areas }}" as="a" hint-placeholder-count="4">
        <div style="display:flex;gap:12px;padding:12px;border:1px solid var(--a1-divider,#EFEEEA);border-radius:10px">
          <div style="width:32px;height:32px;border-radius:8px;background:var(--a1-muted,#F1F0EC);color:var(--a1-text-2s,#4A4D55);display:flex;align-items:center;justify-content:center;flex:none"><x-import component="Icon" from="./Icon.js" i="{{ a.icon }}" size="16" hint-size="16px,16px"></x-import></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-size:13.5px;font-weight:600">{{ a.t }}</span><span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:{{ a.bBg }};color:{{ a.bFg }};white-space:nowrap">{{ a.st }}</span></div>
            <span style="font-size:12.5px;line-height:1.45;color:var(--a1-text-2,#62656D)">{{ a.d }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>

class Component extends DCLogic {
  state = { q: '', st: 'Todos' };
  renderVals() {
    const s = this.state; const ctx = this.props.ctx || {}; const notify = this.props.notify || (() => {}); const nav = this.props.navigate || (() => {});
    const c = CFG[this.props.view] || CFG.cadastros;
    const place = ['ai', 'integrations', 'documents'].includes(this.props.view) ? (ctx.org || '') : (ctx.firstPosto || ctx.estab || '');
    const sub = (place ? place + ' · ' : '') + 'dados demonstrativos · atualizado às 09:42';
    const cols = c.cols.map((x) => { const [label, a] = x.split('|'); return { label, align: a === 'r' ? 'right' : 'left' }; });
    const statuses = Array.from(new Set(c.rows.map((r) => r[c.st])));
    const q = s.q.trim().toLowerCase();
    const rows = c.rows.filter((r) => (s.st === 'Todos' || r[c.st] === s.st) && (!q || r.join(' ').toLowerCase().includes(q)));
    return {
      c, sub, hasKpis: c.kpis.length > 0,
      kpis: c.kpis.map(([label, value, note, icon]) => ({ label, value, note, icon, noteColor: /crítico|rejeit|falha|ruptura|vence/i.test(note + value) ? 'var(--a1-err-fg,#9E2F27)' : 'var(--a1-text-2,#62656D)' })),
      cols, q: s.q, setQ: (e) => this.setState({ q: e.target.value }),
      chips: ['Todos'].concat(statuses).map((t) => { const on = s.st === t; return { label: t, bg: on ? 'var(--a1-strong,#15171C)' : 'var(--a1-surface,#fff)', fg: on ? '#fff' : 'var(--a1-text-2s,#4A4D55)', border: on ? 'var(--a1-text,#15171C)' : 'var(--a1-border-2,#E1E0DA)', pick: () => this.setState({ st: t }) }; }),
      rows: rows.map((r) => r.map((v, i) => { const isSt = i === c.st; const [bBg, bFg] = tone(v); const mono = /^[\d.,−\- ]+$/.test(v) && v.length > 6;
        return { t: v, badge: isSt, plain: !isSt, bBg, bFg, align: cols[i].align, ws: i === 0 && c.wrap0 ? 'normal' : 'nowrap', minw: i === 0 && c.wrap0 ? '320px' : '0', w: i === 0 ? 600 : 400, font: mono ? "'Geist Mono',monospace" : 'inherit', fs: mono ? '12.5px' : '13px' }; })),
      empty: rows.length === 0, count: rows.length + ' de ' + c.rows.length + ' registros', clear: () => this.setState({ q: '', st: 'Todos' }),
      areas: c.areas.map(([t, d, icon, st]) => { const [bBg, bFg] = tone(st); return { t, d, icon, st, bBg, bFg }; }),
      exportX: () => notify('Exportação gerada: ' + c.title.toLowerCase().replace(/\s+/g, '_') + '.xlsx', 'success'),
      primaryRun: () => { if (c.route) return nav(c.route); notify(c.primary + ': ação demonstrativa no protótipo.', 'info'); }
    };
  }
